<svg xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmlns:dp="https://dhrub.com.np/ns/metadata/" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Fuzion conceptual application architecture</title>
  <desc id="desc">React interfaces use Supabase identity and data APIs backed by PostgreSQL permission policies and transactions. A separate Node delivery path processes notification events through an outbox and delivery adapter. This is an implementation overview, not a live operational acceptance result.</desc>
  <metadata><rdf:RDF><rdf:Description dc:title="Fuzion conceptual application architecture" xmp:CreatorTool="Dhruba Poudel" dp:Author="Dhruba Poudel" dp:Creator="Dhruba Poudel" dp:LastModifiedBy="Dhruba Poudel"><dc:creator><rdf:Seq><rdf:li>Dhruba Poudel</rdf:li></rdf:Seq></dc:creator><dc:contributor><rdf:Seq><rdf:li>Dhruba Poudel</rdf:li></rdf:Seq></dc:contributor></rdf:Description></rdf:RDF></metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#007f7b"/></marker></defs>
  <rect width="1100" height="680" fill="#f7f6f1"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#102b3d">
