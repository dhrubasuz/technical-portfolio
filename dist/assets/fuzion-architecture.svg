    <text x="48" y="91" font-size="30" font-weight="700">Clear boundaries, shared business rules.</text>
    <text x="48" y="120" font-size="17" fill="#52646d">Implementation overview · Public pages and role-aware operations have distinct responsibilities.</text>
    <rect x="48" y="165" width="245" height="215" rx="7" fill="#fff" stroke="#c5d3cb"/>
    <text x="72" y="202" font-size="14" fill="#007f7b" letter-spacing="1" font-weight="700">INTERFACE</text>
    <text x="72" y="240" font-size="25" font-weight="700">React / Vite</text>
    <text x="72" y="276" font-size="18" fill="#52646d">Public information</text>
    <text x="72" y="305" font-size="18" fill="#52646d">Learner workspace</text>
    <text x="72" y="334" font-size="18" fill="#52646d">Instructor / admin views</text>
    <rect x="376" y="165" width="284" height="215" rx="7" fill="#e4eee7" stroke="#9ab9aa"/>
    <text x="400" y="202" font-size="14" fill="#007f7b" letter-spacing="1" font-weight="700">IDENTITY &amp; DATA ACCESS</text>
    <text x="400" y="240" font-size="25" font-weight="700">Supabase</text>
    <text x="400" y="276" font-size="18" fill="#52646d">Authentication</text>
    <text x="400" y="305" font-size="18" fill="#52646d">Controlled data APIs</text>
    <text x="400" y="334" font-size="18" fill="#52646d">Database function calls</text>
    <rect x="743" y="165" width="309" height="215" rx="7" fill="#102b3d"/>
    <text x="768" y="202" font-size="14" fill="#acd6c7" letter-spacing="1" font-weight="700">DURABLE STATE</text>
    <text x="768" y="240" font-size="25" fill="#fff" font-weight="700">PostgreSQL</text>
    <text x="768" y="276" font-size="18" fill="#d2dfdc">Role / row-level policies</text>
    <text x="768" y="305" font-size="18" fill="#d2dfdc">Transactional booking rules</text>
    <text x="768" y="334" font-size="18" fill="#d2dfdc">Ledger + notification events</text>
    <path d="M293 272H363" fill="none" stroke="#007f7b" stroke-width="2.5" marker-end="url(#arrow)"/>
