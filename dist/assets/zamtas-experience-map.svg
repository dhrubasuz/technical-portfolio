<svg xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmlns:dp="https://dhrub.com.np/ns/metadata/" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Zamtas websites conceptual information map</title>
  <desc id="desc">Two public visitor paths: the Zamtas corporate website connects company and product navigation with automatic and industrial door information. Zamtas Traffic connects traffic and road-safety product categories with details, brochures and quote-request entry points. These are conceptual information paths, not tested order or quotation transactions.</desc>
  <metadata><rdf:RDF><rdf:Description dc:title="Zamtas websites conceptual information map" xmp:CreatorTool="Dhruba Poudel" dp:Author="Dhruba Poudel" dp:Creator="Dhruba Poudel" dp:LastModifiedBy="Dhruba Poudel"><dc:creator><rdf:Seq><rdf:li>Dhruba Poudel</rdf:li></rdf:Seq></dc:creator><dc:contributor><rdf:Seq><rdf:li>Dhruba Poudel</rdf:li></rdf:Seq></dc:contributor></rdf:Description></rdf:RDF></metadata>
