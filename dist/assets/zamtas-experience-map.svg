    <text x="72" y="269" font-size="17" fill="#52646d">zamtas.com.au</text>
    <path d="M298 238H351" fill="none" stroke="#007f7b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="382" y="230" font-size="21" font-weight="700">Company &amp; product groups</text>
    <text x="382" y="261" font-size="17" fill="#52646d">Orient the visitor</text>
