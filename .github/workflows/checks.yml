name: Portfolio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate data and classification logic
        run: node --test dist/lab/data/core.test.mjs dist/ai-lab/data/model.test.mjs
      - name: Check pages and assets
        run: node scripts/check_site.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check dist/assets/portfolio.js
          node --check dist/lab/workbench.js
          node --check dist/lab/data/core.js
          node --check dist/lab/data/fixtures.js
          node --check dist/ai-lab/triage.js
          node --check dist/ai-lab/data/model.js
          node --check dist/ai-lab/data/fixtures.js
